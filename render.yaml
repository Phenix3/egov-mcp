services:
  - type: web
    name: liwaza-egov-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-4-6
      - key: LOG_LEVEL
        value: INFO
      # Secrets — à saisir manuellement dans le dashboard Render
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      # Optionnel : autres providers
      - key: OPENAI_API_KEY
        sync: false
      - key: K2_API_KEY
        sync: false
      - key: K2_BASE_URL
        value: https://api.k2think.ai/v1
